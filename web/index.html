<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    Recruiters' tools and link previews can't read text inside the Flutter
    canvas, so everything they need lives here as plain HTML.
  -->
  <title>Damola Nelson — Flutter Mobile Engineer</title>
  <meta name="description" content="Damola Nelson is a Flutter mobile engineer in Lagos. Live, working demos of offline-first sync, live map tracking and OTP input — all built in Flutter.">
  <meta name="author" content="Damola Nelson">
  <meta name="theme-color" content="#0B0D11">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Damola Nelson — Flutter Mobile Engineer">
  <meta property="og:description" content="Flutter mobile engineer in Lagos. Poke the live demos: offline-first sync, live map tracking, OTP input done properly.">
  <meta property="og:site_name" content="Damola Nelson">
  <!-- Link previews need absolute URLs. Update these if the domain changes. -->
  <link rel="canonical" href="https://damola-nelson.web.app/">
  <meta property="og:url" content="https://damola-nelson.web.app/">
  <meta property="og:image" content="https://damola-nelson.web.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://damola-nelson.web.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Damola Nelson — Flutter Mobile Engineer">
  <meta name="twitter:description" content="Flutter mobile engineer in Lagos. Poke the live demos.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Damola Nelson">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B0D11; }

    /* Loading screen: Flutter web downloads a few MB before the first frame,
       so this matches the site's navy and pulses the initials meanwhile. */
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #0B0D11;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      transition: opacity 300ms ease;
      z-index: 10;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .mark {
      width: 64px; height: 64px; border-radius: 16px;
      display: grid; place-items: center;
      background: #3D8BFF; border: 0;
      color: #E9EDF7; font: 800 24px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.5px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    #loader .status { color: #8B94AE; font-size: 12px; letter-spacing: 0.02em; }
    #loader .status::before {
      content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px;
      border-radius: 50%; background: #4ADE80; vertical-align: 1px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(61, 139, 255, 0.45); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(61, 139, 255, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loader .mark { animation: none; }
    }

    /* Safety net: if the app hasn't drawn after a while (slow or blocked
       network), offer the essentials as plain links. */
    #loader .slow {
      display: none; max-width: 340px; padding: 0 20px; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #loader.slow-net .slow { display: block; animation: fade-in 400ms ease both; }
    #loader .slow p { color: #8B94AE; font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
    #loader .slow .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    #loader .slow a, #loader .slow button {
      color: #E9EDF7; font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      text-decoration: none; padding: 9px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14); background: transparent;
    }
    #loader .slow a.primary { background: #3D6BFF; border-color: #3D6BFF; }
    #loader .slow button { margin-top: 12px; color: #8B94AE; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-label="Loading Damola Nelson's portfolio">
    <div class="mark">DN</div>
    <div class="status">flutter run · launching lib/main.dart</div>
    <div class="slow">
      <p>Taking longer than usual on this connection. Here are the essentials while it loads:</p>
      <div class="links">
        <a class="primary" href="assets/assets/resume.pdf" target="_blank" rel="noopener">Resume (PDF)</a>
        <a href="mailto:damolanelson@gmail.com">Email</a>
        <a href="https://www.linkedin.com/in/damola-owonifari" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/damooola" target="_blank" rel="noopener">GitHub</a>
      </div>
      <button type="button" onclick="location.reload()">Reload</button>
    </div>
  </div>

  <!-- Plain-text fallback for crawlers and screen readers before Flutter loads. -->
  <noscript>
    <h1>Damola Nelson — Flutter Mobile Engineer</h1>
    <p>Flutter mobile engineer in Lagos. This site needs JavaScript to run its live demos.</p>
    <p>Email: damolanelson@gmail.com · GitHub: github.com/damooola</p>
  </noscript>

  <script>
    // If the app still hasn't drawn after 12s, show plain-HTML links to the
    // resume and contacts. Cancelled as soon as Flutter's first frame lands.
    var slowTimer = setTimeout(function () {
      var loader = document.getElementById('loader');
      if (loader) loader.classList.add('slow-net');
    }, 12000);

    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(slowTimer);
      var loader = document.getElementById('loader');
      if (!loader) return;
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
